<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首都博物馆镇馆之宝 - 图片验证测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .test-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .test-info h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .test-info p {
            color: #666;
            line-height: 1.6;
        }

        .treasures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .treasure-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .treasure-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .treasure-image-container {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .treasure-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s;
        }

        .treasure-image.loading {
            opacity: 0.3;
        }

        .treasure-image.loaded {
            opacity: 1;
        }

        .treasure-image.error {
            opacity: 0.5;
        }

        .loading-spinner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .status-loading {
            background: #ffc107;
        }

        .status-success {
            background: #28a745;
        }

        .status-error {
            background: #dc3545;
        }

        .treasure-content {
            padding: 20px;
        }

        .treasure-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .treasure-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .treasure-url {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            word-break: break-all;
            color: #667eea;
            margin-bottom: 10px;
        }

        .treasure-metadata {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
            color: #999;
        }

        .test-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 40px;
            text-align: center;
        }

        .test-summary h2 {
            margin-bottom: 20px;
            font-size: 2em;
        }

        .test-summary .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            min-width: 150px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .treasures-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ 首都博物馆镇馆之宝</h1>
        <p class="subtitle">图片URL可访问性验证测试</p>

        <div class="test-info">
            <h2>📋 测试说明</h2>
            <p>本页面用于验证首都博物馆三件镇馆之宝的图片URL是否可以正常访问和加载。所有图片均托管在Wikimedia Commons平台。</p>
            <p><strong>测试时间:</strong> <span id="testTime"></span></p>
        </div>

        <div class="treasures-grid" id="treasuresGrid">
            <!-- Treasure cards will be dynamically generated here -->
        </div>

        <div class="test-summary" id="testSummary">
            <h2>📊 测试结果汇总</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="successCount">0</div>
                    <div class="stat-label">成功加载</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="errorCount">0</div>
                    <div class="stat-label">加载失败</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="successRate">0%</div>
                    <div class="stat-label">成功率</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Capital Museum treasures data
        const capitalMuseumTreasures = [
            {
                name: "元代景德镇窑青花凤首扁壶",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Yuan_Dynasty_Blue_and_White_Flask.jpg/400px-Yuan_Dynasty_Blue_and_White_Flask.jpg",
                description: "元代青花瓷代表作，壶身绘凤凰纹饰，造型优美，釉色纯正，是元代景德镇窑的精品，体现了元代制瓷工艺的高超水平"
            },
            {
                name: "乾隆款金嵌珍珠天球仪",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Qianlong_Celestial_Globe.jpg/400px-Qianlong_Celestial_Globe.jpg",
                description: "清乾隆时期制作的天文仪器，镶嵌珍珠标注星座位置，工艺精湛，既是科学仪器，又是艺术珍品，反映了清代天文学与工艺美术的结合"
            },
            {
                name: "明代金丝翼善冠",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Ming_Dynasty_Crown.jpg/400px-Ming_Dynasty_Crown.jpg",
                description: "明代皇帝冠冕，用金丝编织而成，上嵌珠宝，制作精美，是明代皇家礼制文化的重要实物，展现了明代金属工艺的高超技艺"
            }
        ];

        // Statistics tracking
        let stats = {
            total: capitalMuseumTreasures.length,
            success: 0,
            error: 0,
            loading: capitalMuseumTreasures.length
        };

        // Update test time
        document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');

        // Function to create treasure card
        function createTreasureCard(treasure, index) {
            const card = document.createElement('div');
            card.className = 'treasure-card';
            card.id = `treasure-${index}`;

            const imageContainer = document.createElement('div');
            imageContainer.className = 'treasure-image-container';

            const loadingSpinner = document.createElement('div');
            loadingSpinner.className = 'loading-spinner';
            imageContainer.appendChild(loadingSpinner);

            const statusIndicator = document.createElement('div');
            statusIndicator.className = 'status-indicator status-loading';
            statusIndicator.textContent = '加载中...';
            imageContainer.appendChild(statusIndicator);

            const img = document.createElement('img');
            img.className = 'treasure-image loading';
            img.alt = treasure.name;

            // Track load time
            const startTime = Date.now();

            img.onload = function() {
                const loadTime = Date.now() - startTime;
                img.classList.remove('loading');
                img.classList.add('loaded');
                loadingSpinner.style.display = 'none';
                statusIndicator.className = 'status-indicator status-success';
                statusIndicator.textContent = `✓ 成功 (${loadTime}ms)`;
                
                stats.success++;
                stats.loading--;
                updateStats();
                
                console.log(`✓ 成功加载: ${treasure.name} (${loadTime}ms)`);
            };

            img.onerror = function() {
                const loadTime = Date.now() - startTime;
                img.classList.remove('loading');
                img.classList.add('error');
                loadingSpinner.style.display = 'none';
                statusIndicator.className = 'status-indicator status-error';
                statusIndicator.textContent = `✗ 失败`;
                
                stats.error++;
                stats.loading--;
                updateStats();
                
                console.error(`✗ 加载失败: ${treasure.name}`);
            };

            img.src = treasure.imageUrl;
            imageContainer.appendChild(img);

            const content = document.createElement('div');
            content.className = 'treasure-content';

            content.innerHTML = `
                <div class="treasure-title">${treasure.name}</div>
                <div class="treasure-description">${treasure.description}</div>
                <div class="treasure-url">
                    <strong>图片URL:</strong><br>
                    <a href="${treasure.imageUrl}" target="_blank" rel="noopener noreferrer">${treasure.imageUrl}</a>
                </div>
                <div class="treasure-metadata">
                    <span>📦 来源: Wikimedia Commons</span>
                    <span>🔗 <a href="${treasure.imageUrl}" target="_blank">原图链接</a></span>
                </div>
            `;

            card.appendChild(imageContainer);
            card.appendChild(content);

            return card;
        }

        // Function to update statistics
        function updateStats() {
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('successCount').textContent = stats.success;
            document.getElementById('errorCount').textContent = stats.error;
            
            const successRate = stats.total > 0 ? Math.round((stats.success / stats.total) * 100) : 0;
            document.getElementById('successRate').textContent = successRate + '%';
        }

        // Initialize page
        function init() {
            const grid = document.getElementById('treasuresGrid');
            
            capitalMuseumTreasures.forEach((treasure, index) => {
                const card = createTreasureCard(treasure, index);
                grid.appendChild(card);
            });

            updateStats();
        }

        // Start test on page load
        window.addEventListener('DOMContentLoaded', init);

        // Log test information
        console.log('='.repeat(60));
        console.log('首都博物馆镇馆之宝 - 图片URL验证测试');
        console.log('='.repeat(60));
        console.log('测试时间:', new Date().toLocaleString('zh-CN'));
        console.log('测试图片数量:', capitalMuseumTreasures.length);
        console.log('图片来源: Wikimedia Commons');
        console.log('='.repeat(60));
    </script>
</body>
</html>
