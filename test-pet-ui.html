<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet UI Test</title>
    <link rel="stylesheet" href="http://localhost:8000/virtual-pet.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .demo-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .demo-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .virtual-pet-container {
            position: relative;
            display: block;
            max-width: 300px;
            margin: 0 auto;
        }
        body.child-mode .virtual-pet-container {
            display: block;
        }
    </style>
</head>
<body class="child-mode">
    <div class="demo-section">
        <div class="demo-title">死亡宠物 UI - 显示复活(5积分)和换宠物(50积分)选项</div>
        <div class="pet-content">
            <div class="pet-dead">
                <div class="pet-dead-emoji">😢</div>
                <div class="pet-dead-name">小猫</div>
                <div class="pet-dead-message">你的宠物因为太久没有喂食离开了...</div>
                <div class="pet-dead-actions">
                    <button class="pet-action-btn revive-btn">
                        💫 复活 (5积分)
                    </button>
                    <button class="pet-action-btn reset-btn">
                        🔄 换宠物 (50积分)
                    </button>
                </div>
                <div class="pet-dead-note">复活当前宠物或换一只新宠物</div>
            </div>
        </div>
    </div>

    <div class="demo-section">
        <div class="demo-title">活着的宠物 UI - 显示喂食、攻击、防御和换宠物按钮</div>
        <div class="pet-content">
            <div class="pet-alive">
                <div class="pet-points-display">
                    <span class="points-icon">⭐</span>
                    <span class="points-value">100</span>
                    <span class="points-label">积分</span>
                </div>
                
                <div class="pet-display">
                    <span class="pet-main-emoji">🐱</span>
                    <div class="pet-name-display">小猫</div>
                    <div class="pet-level-badge level-2">
                        Lv.2 见习
                    </div>
                </div>
                
                <div class="pet-level-progress">
                    <div class="level-progress-label">
                        <span>等级进度</span>
                        <span>还需 75 积分</span>
                    </div>
                    <div class="level-progress-bar">
                        <div class="level-progress-fill level-2" style="width: 50%"></div>
                    </div>
                </div>
                
                <div class="pet-stats">
                    <div class="pet-stat">
                        <span class="stat-icon">🍖</span>
                        <div class="stat-bar">
                            <div class="stat-fill hunger-fill normal" style="width: 65%"></div>
                        </div>
                        <span class="stat-value">一般</span>
                    </div>
                    <div class="pet-stat-row">
                        <div class="pet-stat-item">
                            <span class="stat-icon">⚔️</span>
                            <span class="stat-value">15</span>
                        </div>
                        <div class="pet-stat-item">
                            <span class="stat-icon">🛡️</span>
                            <span class="stat-value">15</span>
                        </div>
                        <div class="pet-stat-item">
                            <span class="stat-icon">🧠</span>
                            <span class="stat-value">10</span>
                        </div>
                        <div class="pet-stat-item">
                            <span class="stat-icon">🎮</span>
                            <span class="stat-value">5</span>
                        </div>
                    </div>
                </div>
                
                <div class="pet-actions">
                    <button class="pet-action-btn feed-btn">
                        🍖 喂食 (5)
                    </button>
                    <button class="pet-action-btn attack-btn">
                        ⚔️ 攻击 (25)
                    </button>
                    <button class="pet-action-btn defense-btn">
                        🛡️ 防御 (25)
                    </button>
                </div>
                
                <div class="pet-reset-section">
                    <button class="pet-action-btn reset-btn">
                        🔄 换宠物 (50)
                    </button>
                    <div class="pet-reset-note">换一只新宠物重新开始</div>
                </div>
                
                <div class="pet-message"></div>
            </div>
        </div>
    </div>
</body>
</html>
