<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Museum Dropdown Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; background: #f0f0f0; border-radius: 8px; }
        .success { color: green; background: #e8f5e9; padding: 10px; border-radius: 4px; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; }
        select { padding: 10px; font-size: 14px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Museum Data Manager - Dropdown Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Museum Metadata Loading</h2>
        <div id="test1-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Museum Data Loader Initialization</h2>
        <div id="test2-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Dropdown Element Check</h2>
        <div id="test3-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 4: Real Dropdown Test</h2>
        <select id="quickLoadMuseumId">
            <option value="">-- Select Museum --</option>
        </select>
        <button onclick="loadDropdown()">Load Dropdown</button>
        <div id="test4-result"></div>
    </div>

    <script src="/js/museum-data-loader.js"></script>
    <script>
        const testResults = {};

        // Test 1: Load museums-meta.json
        async function test1() {
            try {
                const response = await fetch('/data/museums-meta.json');
                const museums = await response.json();
                testResults['test1'] = `<div class="success">✓ Loaded ${museums.length} museums from museums-meta.json</div>`;
                return museums;
            } catch (error) {
                testResults['test1'] = `<div class="error">✗ Failed to load museums-meta.json: ${error.message}</div>`;
                return null;
            }
        }

        // Test 2: Initialize MuseumDataLoader
        function test2() {
            try {
                const loader = new MuseumDataLoader();
                testResults['test2'] = `<div class="success">✓ MuseumDataLoader initialized successfully</div>`;
                return loader;
            } catch (error) {
                testResults['test2'] = `<div class="error">✗ Failed to initialize MuseumDataLoader: ${error.message}</div>`;
                return null;
            }
        }

        // Test 3: Check dropdown element
        function test3() {
            try {
                const dropdown = document.getElementById('quickLoadMuseumId');
                if (!dropdown) {
                    testResults['test3'] = `<div class="error">✗ Dropdown element #quickLoadMuseumId not found</div>`;
                    return false;
                }
                testResults['test3'] = `<div class="success">✓ Dropdown element found</div>`;
                return true;
            } catch (error) {
                testResults['test3'] = `<div class="error">✗ Error checking dropdown: ${error.message}</div>`;
                return false;
            }
        }

        // Test 4: Populate dropdown
        async function loadDropdown() {
            try {
                const response = await fetch('/data/museums-meta.json');
                const museums = await response.json();
                const dropdown = document.getElementById('quickLoadMuseumId');
                
                museums.forEach(museum => {
                    const option = document.createElement('option');
                    option.value = museum.id;
                    option.textContent = `${museum.name} (${museum.id})`;
                    dropdown.appendChild(option);
                });
                
                testResults['test4'] = `<div class="success">✓ Added ${museums.length} museums to dropdown</div>`;
                document.getElementById('test4-result').innerHTML = testResults['test4'];
                console.log('Dropdown populated with', museums.length, 'museums');
            } catch (error) {
                testResults['test4'] = `<div class="error">✗ Failed to populate dropdown: ${error.message}</div>`;
                document.getElementById('test4-result').innerHTML = testResults['test4'];
            }
        }

        // Run all tests on page load
        async function runAllTests() {
            const museums = await test1();
            const loader = test2();
            test3();
            
            document.getElementById('test1-result').innerHTML = testResults['test1'];
            document.getElementById('test2-result').innerHTML = testResults['test2'];
            document.getElementById('test3-result').innerHTML = testResults['test3'];
            
            console.log('Test results:', testResults);
            console.log('Museums loaded:', museums);
        }

        window.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
