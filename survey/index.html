<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
    <!-- Baidu Analytics (百度统计) -->
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?10856afa2ea23687b7e8f5b901795c57";
            var s = document.getElementsByTagName("script")[0]; 
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <title>统一统 - 博物馆互动调查</title>
    <script src="../js/debug-mode.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", 
                         "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .survey-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .survey-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .survey-card {
            display: flex;
            flex-direction: column;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            text-decoration: none;
            color: inherit;
        }

        .survey-card:hover {
            border-color: #3498db;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
        }

        .survey-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        .survey-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        .survey-description {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            line-height: 1.5;
        }

        .more {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .more a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .more a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* Expired activity styles */
        .survey-card.expired {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            background: #f8f9fa;
            border-color: #dee2e6;
            transform: none !important;
            box-shadow: none !important;
        }

        .expired-badge {
            display: inline-block;
            background: #6c757d;
            color: white;
            font-size: 0.7em;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .section-header {
            font-size: 1.1em;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #ecf0f1;
        }

        .active-section {
            margin-bottom: 30px;
        }

        .expired-section {
            margin-bottom: 10px;
        }

        .expired-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #7f8c8d;
            padding: 8px 0;
            width: 100%;
            text-align: left;
            margin-bottom: 12px;
            transition: color 0.2s;
        }

        .expired-toggle:hover {
            color: #555;
        }

        .expired-toggle .toggle-icon {
            font-size: 0.85em;
            transition: transform 0.25s;
        }

        .expired-toggle.open .toggle-icon {
            transform: rotate(90deg);
        }

        .expired-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .expired-grid.open {
            display: grid;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .survey-container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .subtitle {
                font-size: 1em;
            }
            
            .survey-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <h1>🎯 统一统</h1>
        <p class="subtitle">选择一个有趣的博物馆互动调查</p>

        <!-- Active activities -->
        <div class="active-section" id="activeSection">
            <div class="section-header">🟢 进行中的活动</div>
            <div class="survey-grid" id="activeGrid"></div>
        </div>

        <!-- Expired activities (collapsible) -->
        <div class="expired-section" id="expiredSection" style="display:none;">
            <button class="expired-toggle" id="expiredToggle" aria-expanded="false">
                <span class="toggle-icon">▶</span>
                <span id="expiredLabel">历史活动</span>
            </button>
            <div class="expired-grid" id="expiredGrid"></div>
        </div>
        
        <div class="more">
            <a href="../index.html">← 返回博物馆打卡首页</a>
        </div>
    </div>
    <script src="../js/event-wall-service.js"></script>
    <script src="../js/event-tracking-init.js"></script>
    <script>
        // Activity definitions. Set endDate to null for ongoing activities.
        // Set endDate to a past date to mark an activity as expired.
        const ACTIVITIES = [
            {
                href: 'national-treasures/index.html',
                icon: '🎁',
                title: '中国十大国宝',
                description: '选择你亲眼见过的国宝文物，看看有多少人和你一样',
                endDate: null
            },
            {
                href: 'treasure/index.html',
                icon: '🏺',
                title: '猜猜镇馆之宝',
                description: '猜猜哪个是博物馆的镇馆之宝',
                endDate: null
            },
            {
                href: 'guess/index.html',
                icon: '🤔',
                title: '看图猜文物',
                description: '看图片猜猜这是什么文物',
                endDate: '2025-12-31'
            },
            {
                href: 'forbidden-city-treasure/index.html',
                icon: '🏯',
                title: '故宫镇馆之宝',
                description: '挑战故宫博物院的国宝知识',
                endDate: null
            },
            {
                href: 'archaeology-museum-treasure/index.html',
                icon: '⛏️',
                title: '考古博物馆宝藏',
                description: '探索考古博物馆的珍贵文物',
                endDate: '2025-06-30'
            },
            {
                href: 'popularity/index.html',
                icon: '🔥',
                title: '人气投票',
                description: '给你最喜欢的文物投票',
                endDate: null
            },
            {
                href: 'vessel-quiz/index.html',
                icon: '🏺',
                title: '容器猜猜看',
                description: '看图识器闯关，你能连对几个？',
                endDate: null
            }
        ];

        function isExpired(endDate) {
            if (!endDate) return false;
            return new Date(endDate) < new Date();
        }

        function buildCard(activity, expired) {
            const card = document.createElement(expired ? 'div' : 'a');
            if (!expired) card.href = activity.href;
            card.className = 'survey-card' + (expired ? ' expired' : '');

            const iconEl = document.createElement('div');
            iconEl.className = 'survey-icon';
            iconEl.textContent = activity.icon;

            const titleEl = document.createElement('div');
            titleEl.className = 'survey-title';
            titleEl.textContent = activity.title;

            const descEl = document.createElement('div');
            descEl.className = 'survey-description';
            descEl.textContent = activity.description;

            card.appendChild(iconEl);
            card.appendChild(titleEl);
            card.appendChild(descEl);

            if (expired) {
                const badge = document.createElement('span');
                badge.className = 'expired-badge';
                badge.textContent = '已结束';
                card.appendChild(badge);
            }

            return card;
        }

        function renderActivities() {
            const activeGrid = document.getElementById('activeGrid');
            const expiredGrid = document.getElementById('expiredGrid');
            const expiredSection = document.getElementById('expiredSection');
            const expiredLabel = document.getElementById('expiredLabel');

            const active = ACTIVITIES.filter(a => !isExpired(a.endDate));
            const expired = ACTIVITIES.filter(a => isExpired(a.endDate));

            active.forEach(a => activeGrid.appendChild(buildCard(a, false)));
            expired.forEach(a => expiredGrid.appendChild(buildCard(a, true)));

            if (expired.length > 0) {
                expiredSection.style.display = '';
                expiredLabel.textContent = `历史活动（${expired.length}）`;
            }
        }

        // Toggle expired section
        document.getElementById('expiredToggle').addEventListener('click', function() {
            const grid = document.getElementById('expiredGrid');
            const isOpen = grid.classList.toggle('open');
            this.classList.toggle('open', isOpen);
            this.setAttribute('aria-expanded', isOpen);
        });

        renderActivities();
    </script>
</body>
</html>
