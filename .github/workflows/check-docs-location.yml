name: 📝 文档位置检查

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches:
      - dev
      - main
    paths:
      - '**.md'

jobs:
  check-docs-location:
    name: 检查文档是否在正确目录
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: 🔍 检查新增的根目录 MD 文件（仅 PR）
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 检查是否有新的根目录 MD 文件..."
          
          # 获取本次提交新增或修改的根目录 MD 文件
          NEW_ROOT_MD=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}..HEAD | grep "^[A-Z].*\.md$" || true)
          
          # 白名单（仅允许这些文件在根目录）
          ALLOWED="README.md CHANGELOG.md CONTRIBUTING.md LICENSE.md"
          
          VIOLATIONS=""
          if [ -n "$NEW_ROOT_MD" ]; then
            for file in $NEW_ROOT_MD; do
              if ! echo "$ALLOWED" | grep -q "$file"; then
                VIOLATIONS="$VIOLATIONS $file"
              fi
            done
          fi
          
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ 检测到在根目录创建或修改新的 MD 文件："
            for file in $VIOLATIONS; do
              echo "  ❌ $file"
            done
            echo ""
            echo "📋 请将文档移动到 docs/ 子目录："
            echo "  - docs/architecture/ - 架构文档"
            echo "  - docs/features/     - 功能文档"
            echo "  - docs/guides/       - 开发指南"
            echo "  - docs/api/          - API 文档"
            echo "  - docs/reports/      - 进度报告"
            echo ""
            echo "📖 详细规范: .github/copilot-instructions-docs.md"
            exit 1
          else
            echo "✅ 未发现违规文档"
          fi
      
      - name: 📊 运行完整检查（含已存在文件）
        run: |
          bash devops/scripts/check-docs-location.sh
      
      - name: 📧 发送失败通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const runId = context.runId;
            
            // 创建 issue 通知失败
            await github.rest.issues.create({
              owner,
              repo,
              title: '🚨 Workflow 失败通知: 文档位置检查',
              body: `## 📝 文档位置检查 Workflow 失败
              
              **触发事件**: ${{ github.event_name }}
              **分支**: ${{ github.ref }}
              **提交**: ${sha}
              **Workflow 运行**: #${runId}
              
              ### 🔗 相关链接
              - [查看 Workflow 运行](${{ github.server_url }}/${owner}/${repo}/actions/runs/${runId})
              - [查看提交详情](${{ github.server_url }}/${owner}/${repo}/commit/${sha})
              
              ### 📋 检查内容
              - 检查根目录是否有违规的 MD 文件
              - 验证文档是否在正确的目录结构中
              
              请及时检查并修复相关问题。
              
              ---
              *此 issue 由 workflow 自动创建*`,
              labels: ['bug', 'workflow-failure', 'docs']
            });
