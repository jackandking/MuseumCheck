name: Deploy Prod to Cloud Server

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate debug status metadata
        run: node devops/scripts/write-debug-status.js
        env:
          DEBUG_STATUS_ENVIRONMENT: prod-cloud-server

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare deploy path
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo mkdir -p ${{ secrets.DEPLOY_PATH }}"

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'backup/' \
            --exclude '.agents/' \
            --exclude '.user.ini' \
            --exclude 'devops/' \
            --exclude 'wiki/' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'jest.config*' \
            --exclude '.husky/' \
            --exclude 'images/' \
            --exclude 'files/' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Set permissions
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            sudo find "$DEPLOY_PATH" -mindepth 1 \( -name .user.ini -o -path "$DEPLOY_PATH/.agents" -o -path "$DEPLOY_PATH/.agents/*" \) -prune -o -exec chown -h www:www {} +
            sudo find "$DEPLOY_PATH" \( -name .user.ini -o -path "$DEPLOY_PATH/.agents" -o -path "$DEPLOY_PATH/.agents/*" \) -prune -o -type d -exec chmod 755 {} +
            sudo find "$DEPLOY_PATH" \( -name .user.ini -o -path "$DEPLOY_PATH/.agents" -o -path "$DEPLOY_PATH/.agents/*" \) -prune -o -type f -exec chmod 644 {} +
          '

      # Purge Tencent CDN for the static assets touched by this deploy.
      # museumcheck.cn is fronted by Tencent CDN which caches js/css/html with
      # `immutable, max-age=2592000`; a post-deploy purge removes the race where the
      # CDN can pin a stale file under a new ?v= key during the rsync write-window.
      # Requires TENCENT_SECRET_ID / TENCENT_SECRET_KEY repo secrets; if absent the
      # script no-ops (and continue-on-error keeps the deploy green either way).
      - name: Purge Tencent CDN cache for deployed assets
        continue-on-error: true
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          CHANGED=$(git show --name-only --pretty="" HEAD)
          PATHS=""
          for f in $CHANGED; do
            case "$f" in
              js/*)    PATHS="$PATHS /js/";;
              css/*)   PATHS="$PATHS /css/";;
              *.html)  PATHS="$PATHS /$f";;
            esac
          done
          PATHS=$(echo $PATHS | tr ' ' '\n' | sort -u | tr '\n' ' ')
          if [ -n "$PATHS" ]; then
            echo "Purging CDN paths: $PATHS"
            python3 devops/scripts/purge-cdn-cache.py --paths $PATHS
          else
            echo "No js/css/html changed in this commit -> nothing to purge."
          fi
