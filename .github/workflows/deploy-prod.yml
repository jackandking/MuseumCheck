name: Deploy Prod to Pages

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate debug status metadata
        run: node devops/scripts/write-debug-status.js
        env:
          DEBUG_STATUS_ENVIRONMENT: prod-github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
