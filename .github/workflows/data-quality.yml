name: Data Quality Checks

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'core/data-manager.js'
      - 'core/storage/*.js'
      - 'js/museums-meta.js'
      - 'script.js'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'core/data-manager.js'
      - 'core/storage/*.js'
      - 'js/museums-meta.js'
      - 'script.js'

jobs:
  data-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run data quality tests
        run: npm run test:data-quality
      
      - name: Validate museum data structure
        run: npm run validate-data
      
      - name: Check for duplicate museums
        run: |
          node << 'EOF'
          const fs = require('fs');
          
          // Load from museums-meta.js (primary source - metadata only)
          const content = fs.readFileSync('js/museums-meta.js', 'utf8');
          
          // Count museum objects from museums-meta.js
          const idMatches = content.match(/"id":\s*"[^"]+"/g) || [];
          const museums = idMatches.length;
          
          if (museums === 0) {
            console.error('❌ No museum metadata found in js/museums-meta.js');
            process.exit(1);
          }
          
          console.log(`✅ Total museums in metadata: ${museums}`);
          
          // Check for duplicate IDs
          const ids = new Set();
          let dupCount = 0;
          
          (content.match(/"id":\s*"([^"]+)"/g) || []).forEach(match => {
            const id = match.match(/"id":\s*"([^"]+)"/)[1];
            if (ids.has(id)) {
              console.log(`❌ DUPLICATE ID: ${id}`);
              dupCount++;
            } else {
              ids.add(id);
            }
          });
          
          // Check for duplicate names
          const names = new Set();
          let dupNames = 0;
          
          (content.match(/"name":\s*"([^"]+)"/g) || []).forEach(match => {
            const name = match.match(/"name":\s*"([^"]+)"/)[1];
            if (names.has(name)) {
              console.log(`❌ DUPLICATE NAME: ${name}`);
              dupNames++;
            } else {
              names.add(name);
            }
          });
          
          if (dupCount === 0 && dupNames === 0) {
            console.log('✅ No duplicates found');
            process.exit(0);
          } else {
            console.log(`❌ Found ${dupCount} duplicate IDs and ${dupNames} duplicate names`);
            process.exit(1);
          }
          EOF
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Data Quality Check Failed**\n\nPlease review the museum data for duplicates or validation errors. See the workflow logs for details.'
            })
