name: Run Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: |
          # Clean npm cache to avoid corruption issues
          npm cache clean --force
          # Remove node_modules and package-lock.json to ensure clean install
          rm -rf node_modules package-lock.json
          # Install fresh dependencies
          npm install
      
      - name: Verify dependencies
        run: |
          # Verify jest is installed
          npx jest --version
          # List installed packages to confirm
          npm list --depth=0
      
      - name: Run unit tests
        run: npm test
      
      - name: Generate coverage report
        run: npm run test:coverage
      
      - name: Check coverage threshold
        run: |
          # Check if coverage summary exists
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "Current coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Coverage is below 80% threshold"
              exit 1
            else
              echo "✅ Coverage meets 80% threshold"
            fi
          else
            echo "⚠️ Coverage summary file not found, skipping threshold check"
          fi

  notify-failure:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            
            // Create an issue for failed workflow
            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Test workflow failed on ${context.ref}`,
              body: `## Test Failure Alert\n\n**Branch:** \`${context.ref}\`\n**Commit:** \`${context.sha.substring(0, 7)}\`\n**Run:** [View Details](${runUrl})\n\nPlease investigate and fix the failing tests.`,
              labels: ['bug', 'ci-failure']
            });
