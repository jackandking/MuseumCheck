name: E2E Tests

on:
  pull_request:
    branches: [ dev, main ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run smoke tests
        run: npx playwright test e2e/homepage.spec.ts e2e/single-museum.spec.ts --project=chromium
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  e2e-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run E2E tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
      
      - name: 📧 发送 E2E 测试失败通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const runId = context.runId;
            const browser = '${{ matrix.browser }}';
            
            await github.rest.issues.create({
              owner,
              repo,
              title: '🚨 E2E 测试失败通知',
              body: `## 🧪 E2E 测试失败
              
              **触发事件**: ${{ github.event_name }}
              **分支**: ${{ github.ref }}
              **提交**: ${sha}
              **Workflow 运行**: #${runId}
              **浏览器**: ${browser}
              
              ### 🔗 相关链接
              - [查看 Workflow 运行](${{ github.server_url }}/${owner}/${repo}/actions/runs/${runId})
              - [查看提交详情](${{ github.server_url }}/${owner}/${repo}/commit/${sha})
              - [下载测试报告](${{ github.server_url }}/${owner}/${repo}/actions/runs/${runId})
              
              ### 📋 失败的测试
              请查看测试报告了解具体失败信息。
              
              ---
              *此 issue 由 workflow 自动创建*`,
              labels: ['bug', 'workflow-failure', 'test']
            });
