name: E2E Sanity Tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'e2e/**'
      - 'playwright.config.js'
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  sanity-tests:
    name: Run E2E Sanity Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        browser: [chromium, firefox, mobile-chrome]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run sanity tests
        run: npx playwright test e2e/sanity.spec.ts --project=${{ matrix.browser }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
