<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Capital Museum Test</title>
    <script src="museums-data.js"></script>
</head>
<body>
    <h1>Capital Museum Data Test</h1>
    <div id="output"></div>
    <script>
        const museum = MUSEUMS.find(m => m.id === 'beijing-capital-museum');
        
        if (museum) {
            let html = '<h2>' + museum.name + '</h2>';
            html += '<p><strong>Building Image:</strong></p>';
            html += '<img src="' + museum.image + '" style="max-width: 400px;" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text x=%2210%22 y=%2220%22>Image Error</text></svg>%27"/>';
            
            html += '<h3>Collections (镇馆之宝):</h3>';
            museum.collections.forEach((c, i) => {
                html += '<div style="margin: 20px 0; padding: 10px; border: 1px solid #ccc;">';
                html += '<h4>' + (i+1) + '. ' + c.name + '</h4>';
                html += '<img src="' + c.imageUrl + '" style="max-width: 300px;" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text x=%2210%22 y=%2220%22>Image Error</text></svg>%27"/>';
                html += '<p>' + c.description + '</p>';
                html += '</div>';
            });
            
            document.getElementById('output').innerHTML = html;
        } else {
            document.getElementById('output').innerHTML = '<p style="color: red;">❌ Capital Museum not found!</p>';
        }
    </script>
</body>
</html>
